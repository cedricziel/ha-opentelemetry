name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # Brand assets require a separate PR to home-assistant/brands;
          # not required to install this as a HACS custom repository.
          ignore: brands

  weaver:
    name: Weaver registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install weaver
        run: |
          curl -sL -o weaver.tar.xz \
            https://github.com/open-telemetry/weaver/releases/download/v0.25.1/weaver-x86_64-unknown-linux-gnu.tar.xz
          tar -xf weaver.tar.xz
          echo "$PWD/weaver-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Check registry
        run: weaver registry check -r weaver
