groups:
  - id: metric.homeassistant.entities.count
    type: metric
    metric_name: homeassistant.entities.count
    stability: development
    brief: >
      Entities known to Home Assistant, grouped by domain. Emitted when
      system-scoped metrics are enabled.
    instrument: gauge
    unit: "1"
    attributes:
      - ref: homeassistant.domain
        requirement_level: required

  - id: metric.homeassistant.entities.unavailable.count
    type: metric
    metric_name: homeassistant.entities.unavailable.count
    stability: development
    brief: >
      Entities currently in an unavailable or unknown state, grouped by
      domain. Emitted when system-scoped metrics are enabled.
    instrument: gauge
    unit: "1"
    attributes:
      - ref: homeassistant.domain
        requirement_level: required

  - id: metric.homeassistant.config_entries.count
    type: metric
    metric_name: homeassistant.config_entries.count
    stability: development
    brief: >
      Configured integrations (config entries), grouped by domain and
      state. Emitted when system-scoped metrics are enabled.
    instrument: gauge
    unit: "1"
    attributes:
      - ref: homeassistant.domain
        requirement_level: required
      - ref: homeassistant.config_entry.state
        requirement_level: required

  - id: metric.homeassistant.setup.duration
    type: metric
    metric_name: homeassistant.setup.duration
    stability: development
    brief: >
      Time spent setting up each integration domain during Home Assistant
      startup. Emitted when system-scoped metrics are enabled.
    instrument: gauge
    unit: s
    attributes:
      - ref: homeassistant.domain
        requirement_level: required

  - id: metric.homeassistant.events
    type: metric
    metric_name: homeassistant.events
    stability: development
    brief: >
      Home Assistant bus events observed, grouped by event type. Emitted
      when system-scoped metrics are enabled.
    instrument: counter
    unit: "1"
    attributes:
      - ref: homeassistant.event.type
        requirement_level: required

  - id: metric.homeassistant.entity.state
    type: metric
    metric_name: homeassistant.entity.state
    stability: development
    brief: >
      The current numeric state value of a Home Assistant entity, sampled
      at the configured export interval. Non-numeric entity states are not
      reported. Emitted when entity-scoped metrics are enabled.
    instrument: gauge
    unit: "1"
    attributes:
      - ref: homeassistant.entity_id
        requirement_level: required
      - ref: homeassistant.domain
        requirement_level: required
      - ref: homeassistant.unit
        requirement_level: recommended
      - ref: homeassistant.area
        requirement_level: recommended
