name: ha_opentelemetry
description: >
  Semantic conventions for telemetry emitted by the ha-opentelemetry
  Home Assistant integration: attributes shared across signals, the
  metrics collected for system- and entity-scoped telemetry, and the
  spans emitted for service calls and entity state changes.
schema_url: https://github.com/cedricziel/ha-opentelemetry/schemas/0.1.0
dependencies:
  - name: otel
    registry_path: https://github.com/open-telemetry/semantic-conventions@v1.40.0[model]
    schema_url: https://opentelemetry.io/schemas/1.40.0
